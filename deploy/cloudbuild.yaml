# Google Cloud Build CI/CD Configuration for AutoGuard AI
steps:
  # 1. Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/autoguard-ai:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/autoguard-ai:latest', '-f', 'deploy/Dockerfile', '.']

  # 2. Push Container to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/autoguard-ai:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'autoguard-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/autoguard-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/autoguard-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/autoguard-ai:latest'
