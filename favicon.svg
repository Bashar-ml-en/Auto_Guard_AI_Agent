<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a3" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#1a73e8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0e131d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00e5a3" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Cyber Inner Shield -->
  <path d="M32 10 L50 17 C50 33 42 46 32 52 C22 46 14 33 14 17 Z" fill="url(#shieldGrad)" stroke="#030712" stroke-width="1.5" />

  <!-- AG_AI Typography Overlay -->
  <!-- "AG" Main Letters -->
  <text x="32" y="32" font-family="'Space Grotesk', 'JetBrains Mono', system-ui, sans-serif" font-size="16" font-weight="900" fill="#00e5a3" text-anchor="middle" letter-spacing="-0.5">AG</text>
  
  <!-- "_AI" Accent Underneath -->
  <text x="32" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1">_AI</text>
</svg>
