<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Google 4-Color Vibrant Conic/Linear Gradient -->
    <linearGradient id="googleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />   <!-- Google Blue -->
      <stop offset="33%" stop-color="#EA4335" />  <!-- Google Red -->
      <stop offset="66%" stop-color="#FBBC05" />  <!-- Google Yellow -->
      <stop offset="100%" stop-color="#34A853" /> <!-- Google Green -->
    </linearGradient>

    <!-- Deep Cyber Inner Plate -->
    <radialGradient id="innerPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4285F4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Google 4-Color Outer Ring / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#googleGradient)" filter="url(#badgeGlow)" />
  
  <!-- Sleek Contrast Inner Bed (Gives ultra-high contrast to the AG text) -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#innerPlate)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Prominent, Bold, Ultra-Visible "AG" Monogram -->
  <text x="32" y="41" 
        font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="26" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-0.5">AG</text>
</svg>
